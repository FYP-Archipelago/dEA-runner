[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archipelago-baseline-dea"
version = "0.4.0"
description = "Baseline distributed evolutionary algorithm harness and standardized event log for the Archipelago explainability framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "redis>=5.0",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.scripts]
archipelago = "orchestrator.cli:main"

[tool.setuptools]
packages = ["archipelago_logging", "algorithms", "benchmarks", "orchestrator", "orchestrator.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` keeps the operator-correctness tests readable; the end-to-end test is slow
# enough to be worth marking so it can be excluded with `-m "not slow"`.
addopts = "-q --strict-markers"
markers = [
    "slow: end-to-end runs that launch real island containers",
    "docker: requires a reachable Docker daemon",
]
