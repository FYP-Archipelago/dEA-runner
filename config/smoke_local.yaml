# Smallest configuration that still exercises every moving part: multiple
# islands, real migration over a ring, both log streams, island shards and the
# aggregate. Runs in a few seconds; used by the end-to-end test.
#
#   python -m orchestrator.cli run --config config/smoke_local.yaml

description: "Smoke test: 4 islands of DE on Rastrigin, ring migration."

algorithm: de
algorithm_params:
  strategy: rand/1
  f: 0.5
  cr: 0.9

benchmark: rastrigin
benchmark_params:
  dimension: 10

# Small budget so the whole thing finishes in seconds. 2,000 / 4 islands = 500
# each, over ~20 generations, so a population of about 24.
evaluation_budget: 2000
target_generations: 20
num_islands: 4
strict_island_range: false

termination:
  stagnation_generations: 10
  max_generations: 200

migration:
  enabled: true
  topology: ring
  interval: 3
  num_migrants: 2
  selection: best
  replacement: worst

logging:
  output_dir: runs
  genome_mode: compact

execution:
  # The one config that does NOT use the default docker backend: no daemon, no
  # image build, so it runs anywhere and is what the end-to-end tests drive.
  backend: local
