# Permutation GA on TSPLIB kroA100: the operators of GA_TSP_Berlin52 on a
# 100-city instance, with looser termination so the run spends its budget.
#
# kroA100's optimal tour length is 21282. Each record carries a 100-city
# permutation, which makes this the heaviest preset in Redis
# (docs/MEMORY_MEASUREMENTS.md).

description: "Permutation GA (OX + inversion), 5 islands, TSPLIB kroA100."

algorithm: ga
algorithm_params:
  representation: permutation
  selection: tournament
  tournament_size: 5
  crossover: order
  crossover_rate: 0.9
  mutation: inversion
  mutation_rate: 0.3
  elitism: 2

benchmark: tsp
benchmark_params:
  instance_file: benchmarks/data/tsp/kroA100.tsp

evaluation_budget: 100000
target_generations: 250
num_islands: 5

termination:
  # Generous, because the point here is to fill the budget with useful search
  # rather than to stop as soon as progress slows.
  stagnation_generations: 100
  max_generations: 5000
  target_fitness: 21282.0    # kroA100's known optimum

migration:
  enabled: true
  topology: ring
  interval: 20
  num_migrants: 5
  selection: best
  replacement: worst
  phase_jitter: 4

logging:
  genome_mode: compact
  genome_precision_decimals: 4
