# The quick demo: five islands, one container each, done in seconds. Use it to
# check that the Runner works before starting one of the 100,000-evaluation presets.

description: "DE on Sphere, 5 islands, one Docker container per island."

algorithm: de
benchmark: sphere
benchmark_params:
  dimension: 10

# Deliberately smaller than the other presets' 100,000: container startup
# dominates a short run, and this preset exists to prove the Runner works.
evaluation_budget: 20000
target_generations: 60
num_islands: 5

termination:
  stagnation_generations: 20
  max_generations: 500

migration:
  enabled: true
  topology: ring
  interval: 5
  num_migrants: 3
  selection: best
  replacement: worst

logging:
  genome_mode: compact
